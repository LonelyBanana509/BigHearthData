[package]
name = "bhdata-gateway"
description = "TLS, login, permissions, limits and connections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bhdata-proto = { workspace = true }
bhdata-api = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "sync", "time"] }
tokio-rustls = { workspace = true }

[dev-dependencies]
rcgen = "0.13"
# Only so a test can offer TLS 1.2 and see the gateway refuse it; the library never enables it.
rustls = { workspace = true, features = ["tls12"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "sync", "time"] }

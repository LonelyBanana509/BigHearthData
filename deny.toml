# cargo-deny: supply-chain rules, run by scripts/check.sh (plan section 8).

[graph]
all-features = true

[advisories]
# Known vulnerabilities, unmaintained and yanked crates fail the check.
unmaintained = "all"
yanked = "deny"

[licenses]
# Only licenses that are compatible with shipping the project under Apache-2.0.
# Add a license here only after checking that it is (copyleft licenses are not).
# Likely candidates when a new dependency needs them: BSD-2-Clause, BSD-3-Clause, ISC, Zlib.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
# Two versions of a crate are allowed only when a dependency we do not control needs the second one.
skip = [
    # getrandom 0.2 and windows-sys 0.52 (ring, through rustls) next to the newer lines the rest of the tree uses.
    { name = "getrandom", reason = "ring 0.17 needs getrandom 0.2" },
    { name = "windows-sys", reason = "ring 0.17 needs an older windows-sys than tokio and mio" },
    # syn 2.x (tracing-attributes) next to syn 3.x (async-trait, serde_derive and others).
    { name = "syn", reason = "upstream proc-macro crates are on different major versions" },
    # wasi 0.11 (mio, through tokio) next to wasi 0.14 (wasite, through whoami, through tokio-postgres).
    { name = "wasi", reason = "mio and whoami need different wasi versions" },
]
wildcards = "deny"
# Workspace crates depend on each other by path, with no version number.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
